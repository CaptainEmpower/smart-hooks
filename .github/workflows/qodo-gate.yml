name: Qodo gate

# A dedicated, lightweight gate, separate from the compile/test workflows so it
# re-evaluates when *review* state changes rather than only on code pushes.
# `pull_request` covers opened/synchronize; the review and review-thread events
# let a resolved Qodo thread flip this check green without a new commit or a
# full CI re-run.
#
# Why this repo needs it: Qodo reviews a PR once, shortly after it opens, and
# does not re-review later pushes. Before this gate there was no mechanical
# signal for "the review is addressed" — merges relied on a human reading the
# threads, and a PR merged in the window before Qodo had reviewed at all looked
# exactly like a PR it had reviewed and cleared.
on:
  pull_request:
  pull_request_review:
  pull_request_review_thread:
    types: [resolved, unresolved]

concurrency:
  group: qodo-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Blocking gate: this PR cannot merge while any Qodo review finding is still
  # open. A finding is "closed" once its review thread is resolved.
  qodo-gate:
    name: Qodo findings closed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Gate on unresolved Qodo findings
        uses: CaptainEmpower/launchpad/.github/actions/qodo-findings-gate@9d651239aa3b2fc2b62c9d2782f90e852b4d0c27 # CaptainEmpower/launchpad main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # The org's Qodo app posts review threads as qodo-code-review[bot] —
          # confirmed against the reviews on #8, #10 and #11 in this repo.
          bot-logins: qodo-code-review[bot]
          # Stated rather than left to the default, because it is the reason
          # this pin is newer than sembase's: without it, a PR that Qodo has
          # not reviewed yet reports the same green check as one it reviewed
          # and cleared. Zero findings and zero evidence of a review are the
          # same output and opposite facts.
          require-evidence-of-review: true

  # Re-runs this PR's own gate run when Qodo posts or updates its verdict.
  #
  # Without it the gate's answer goes stale in the direction that hurts: Qodo
  # reviews once, minutes after the PR opens, and the review-thread events
  # above only fire when a human resolves a thread. The run that decided
  # "reviewed: false" never re-evaluates on its own, so the check stays red
  # after Qodo has actually reviewed and found nothing.
  #
  # Launchpad publishes this as a reusable workflow, so it is called rather
  # than copied — the ~195-line snippet it replaced had no propagation path,
  # and fixes upstream reached zero consumers (launchpad#88, #97).
  rerun-after-qodo-comment:
    uses: CaptainEmpower/launchpad/.github/workflows/qodo-gate-rerun.yml@f18b4dce23068ae893861441f7c7cf13cfe36709 # CaptainEmpower/launchpad main
    # Required here, not only in the called workflow: a called workflow's token
    # can be equal to or more restrictive than the caller's, never broader.
    # Omit this and `gh run rerun` reaches for `actions: write` it was never
    # granted, and the one job that corrects a stale verdict fails on auth.
    permissions:
      actions: write        # re-run the gate's own run
      contents: read
      pull-requests: read
    with:
      # This repository is on GitHub-hosted runners — every other workflow
      # here uses ubuntu-latest. The input has no default upstream, so it is
      # stated rather than inherited.
      runner: ubuntu-latest
      # Must match the gate's `bot-logins` above. If the two disagree the gate
      # keeps gating while the re-run stops firing, which latches the check red
      # on exactly the pull requests Qodo has just cleared.
      bot-logins: qodo-code-review[bot]
      # This file's own name, so the workflow can find the runs to re-run.
      workflow-file: qodo-gate.yml
