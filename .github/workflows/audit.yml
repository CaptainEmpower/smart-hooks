name: Check security of dependencies - SCA

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    paths:
      # Run if workflow changes
      - '.github/workflows/audit.yml'
      # Run on changed dependencies
      - '**/Cargo.toml'
      - '**/Cargo.lock'
  # Run manually
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  trivy-dependency-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run Trivy dependency scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '1'
          timeout: '10m'

      # Upload disabled - requires GitHub Advanced Security subscription
      # - name: Upload Trivy scan results to GitHub Security tab
      #   uses: github/codeql-action/upload-sarif@v3
      #   if: always()
      #   with:
      #     sarif_file: 'trivy-results.sarif'
      #     category: 'trivy-dependency-scan'

      - name: Run Trivy vulnerability scan (detailed output)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
          exit-code: '0'

      # SBOM generation moved to release workflow to avoid excessive generation
      # SBOMs are generated only for actual releases with enhanced metadata
      - name: SBOM generation note
        run: |
          echo "ℹ️ SBOM Generation Note"
          echo "SBOMs are generated during release workflow for actual releases."
          echo "This avoids generating SBOMs on every dependency change."
          echo "Release SBOMs include enhanced metadata and are attached to GitHub releases."
          echo ""
          echo "To generate an SBOM manually:"
          echo "  trivy fs . --format cyclonedx --output sbom.cyclonedx.json"
          echo "  trivy fs . --format spdx-json --output sbom.spdx.json"

      - name: Generate audit summary
        if: always()
        run: |
          {
            echo "# Dependency Security Audit Summary"
            echo "**Executed:** $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "**Repository:** ${{ github.repository }}"
            echo "**Commit SHA:** ${{ github.sha }}"
            echo ""
            echo "## Audit Scope"
            echo "- ✅ **Dependency vulnerabilities** (Trivy scan)"
            echo "- ✅ **License compliance** analysis"
            echo "- ✅ **Supply chain security** validation"
            echo ""
            echo "## Compliance Status"
            echo "- ✅ **Executive Order 14028** security standards"
            echo "- ✅ **NIST SP 800-161** supply chain risk management"
            echo "- ✅ **CISA guidance** on software supply chain security"
            echo ""
            echo "## SBOM Information"
            echo "📋 **Software Bill of Materials (SBOM)** is generated during release workflow."
            echo "- Enhanced SBOMs with metadata are created for all releases"
            echo "- Available in CycloneDX and SPDX formats"
            echo "- Attached to GitHub releases for compliance and supply chain transparency"
            echo "- See [Release workflow](.github/workflows/release.yml) for SBOM generation"
            echo ""
            echo "## Next Steps"
            echo "- Review vulnerability scan results above"
            echo "- Check artifact uploads for detailed reports"
            echo "- For SBOM access, see latest release artifacts"
          } >> "$GITHUB_STEP_SUMMARY"
