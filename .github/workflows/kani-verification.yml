name: Kani Bounded Model Checking (Smart)

on:
  pull_request:
    branches: [ main ]
    paths:
      # Run when Kani-verified modules are modified
      - 'crates/git-mvh/src/fast_export/progress_types.rs'
      - 'crates/git-mvh/src/path/normalize.rs'
      # Run on workflow changes
      - '.github/workflows/kani-verification.yml'
  schedule:
    # Run monthly comprehensive verification on first Sunday at 6 AM UTC
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      verbose_output:
        description: 'Enable verbose Kani output'
        required: false
        default: 'false'
        type: choice
        options:
        - 'true'
        - 'false'
      run_all_proofs:
        description: 'Run all proofs (slower but comprehensive)'
        required: false
        default: 'false'
        type: choice
        options:
        - 'true'
        - 'false'

concurrency:
  group: kani-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  kani-arithmetic-verification:
    name: Kani Arithmetic Verification
    runs-on: ubuntu-latest
    # Only run on develop→main PRs, relevant file changes, schedule, or manual dispatch
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.ref == 'develop')

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Rust stable for Kani
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable

    - name: Cache Rust dependencies
      uses: actions/cache@v4.3.0
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: kani-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          kani-${{ runner.os }}-cargo-

    - name: Install Kani
      run: |
        echo "Installing Kani Rust Verifier..."

        # Install Kani binary
        if ! command -v kani &> /dev/null; then
          cargo install --locked kani-verifier
          echo "Kani installed successfully"
        else
          echo "Kani already installed, checking version"
          kani --version
        fi

        # Verify Kani is working
        kani --version

    - name: Setup Kani environment
      run: |
        # Configure Kani settings
        mkdir -p kani-results
        echo "KANI_RESULTS_DIR=$(pwd)/kani-results" >> "$GITHUB_ENV"

        if [[ "${{ github.event.inputs.verbose_output }}" == "true" ]]; then
          echo "KANIFLAGS=--enable-unstable --cbmc-args --trace" >> "$GITHUB_ENV"
          echo "Verbose Kani output enabled"
        else
          echo "KANIFLAGS=--enable-unstable" >> "$GITHUB_ENV"
          echo "Standard Kani output configured"
        fi

    - name: Run Kani verification - Basic operations
      id: kani-basic
      continue-on-error: false
      run: |
        echo "=== Running Kani Basic Arithmetic Verification ==="
        cargo kani --harness verify_move_stats_basic 2>&1 | tee kani-results/kani-basic.log
        echo "basic-verification-status=success" >> "$GITHUB_ENV"

    - name: Run Kani verification - Addition operations
      id: kani-addition
      continue-on-error: false
      run: |
        echo "=== Running Kani Addition Operations Verification ==="
        cargo kani --harness verify_move_stats_addition 2>&1 | tee kani-results/kani-addition.log
        echo "addition-verification-status=success" >> "$GITHUB_ENV"

    - name: Run Kani verification - Increment operations
      id: kani-increments
      continue-on-error: false
      run: |
        echo "=== Running Kani Increment Operations Verification ==="
        cargo kani --harness verify_move_stats_increments 2>&1 | tee kani-results/kani-increments.log
        echo "increments-verification-status=success" >> "$GITHUB_ENV"

    - name: Run Kani verification - Edge cases
      id: kani-edge-cases
      continue-on-error: false
      run: |
        echo "=== Running Kani Edge Cases Verification ==="
        cargo kani --harness verify_move_stats_edge_cases 2>&1 | tee kani-results/kani-edge-cases.log
        echo "edge-cases-verification-status=success" >> "$GITHUB_ENV"

    - name: Run additional proofs (if requested)
      if: github.event.inputs.run_all_proofs == 'true'
      continue-on-error: true
      run: |
        echo "=== Running Additional Kani Proofs ==="
        # Future: Add path normalization proofs when optimized
        echo "Currently only arithmetic proofs are stable for CI" | tee -a kani-results/kani-additional.log

    - name: Analyze Kani verification results
      if: always()
      run: |
        cd kani-results

        # Count total verification checks across all proofs
        total_checks=0
        successful_checks=0
        failed_checks=0

        for logfile in kani-*.log; do
          if [[ -f "$logfile" ]]; then
            # Extract verification statistics from Kani output
            checks=$(grep -o "SUMMARY:" -A 5 "$logfile" | grep -o "[0-9]* of [0-9]* failed" | head -1 || echo "0 of 0 failed")
            if [[ -n "$checks" ]]; then
              failed=$(echo "$checks" | cut -d' ' -f1)
              total=$(echo "$checks" | cut -d' ' -f3)
              succeeded=$((total - failed))

              total_checks=$((total_checks + total))
              successful_checks=$((successful_checks + succeeded))
              failed_checks=$((failed_checks + failed))

              echo "$logfile: $succeeded/$total checks passed" | tee -a verification-summary.txt
            fi
          fi
        done

        # Set environment variables for summary
        {
          echo "total-checks=$total_checks"
          echo "successful-checks=$successful_checks"
          echo "failed-checks=$failed_checks"
        } >> "$GITHUB_ENV"

        echo "Overall: $successful_checks/$total_checks verification checks passed" | tee -a verification-summary.txt

    - name: Generate Kani verification report
      if: always()
      run: |
        cd kani-results

        {
          echo "# Kani Bounded Model Checking Report"
          echo "**Date:** $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "**Workflow Run:** ${{ github.run_number }}"
          echo ""
          echo "## Verification Summary"
          echo "- **Total Checks:** ${{ env.total-checks }}"
          echo "- **Successful:** ${{ env.successful-checks }}"
          echo "- **Failed:** ${{ env.failed-checks }}"
          echo ""
          echo "## Proof Results"
          echo "- **Basic Operations**: ${{ env.basic-verification-status }}"
          echo "- **Addition Operations**: ${{ env.addition-verification-status }}"
          echo "- **Increment Operations**: ${{ env.increments-verification-status }}"
          echo "- **Edge Cases**: ${{ env.edge-cases-verification-status }}"
          echo ""
          echo "## Coverage Analysis"
          echo "**Kani Bounded Model Checking** provides mathematical proofs for:"
          echo ""
          echo "### ✅ Verified Operations"
          echo "- **Arithmetic Safety**: Division by zero protection, overflow detection"
          echo "- **Statistical Calculations**: Average computation correctness"
          echo "- **Data Structure Integrity**: MoveStats construction and modification"
          echo "- **Boundary Conditions**: Edge cases and maximum value handling"
          echo "- **Memory Safety**: Pointer dereference safety, bounds checking"
          echo ""
          echo "### 🔧 Verification Scope"
          echo "- **Bounded inputs**: Values ≤ 100 for efficient verification"
          echo "- **Pure arithmetic**: Focus on mathematical operations"
          echo "- **Formal proofs**: Mathematical certainty within bounds"
          echo "- **Complementary tools**: Works alongside Miri (memory) and Rudra (static)"
          echo ""
          if [[ "${{ env.failed-checks }}" == "0" ]]; then
            echo "## Results"
            echo "✅ **All verification checks passed**"
            echo "- Arithmetic operations are mathematically sound"
            echo "- No overflow or underflow vulnerabilities detected"
            echo "- Division by zero handling is provably safe"
            echo "- Data structure operations maintain invariants"
            echo "- Memory access patterns are verified safe"
          else
            echo "## Results"
            echo "❌ **Verification failures detected**"
            echo "- Review detailed logs for specific proof failures"
            echo "- Address mathematical or safety violations before deployment"
            echo "- Consider strengthening preconditions or bounds"
          fi
          echo ""
          echo "## Detailed Analysis"
          echo '```'
          cat verification-summary.txt 2>/dev/null || echo "No detailed verification summary available"
          echo '```'
          echo ""
          echo "## Security Integration"
          echo "This analysis is part of our **multi-layered verification approach**:"
          echo "1. **Compile-time**: Rust type system + Clippy"
          echo "2. **Static analysis**: Rudra for unsafe code patterns"
          echo "3. **Bounded verification**: Kani for mathematical correctness (this workflow)"
          echo "4. **Runtime analysis**: Miri for memory safety in pure algorithms"
          echo "5. **Integration testing**: Fuzz testing with realistic attack vectors"
        } > kani-verification-report.md

        # Add to step summary
        cat kani-verification-report.md >> "$GITHUB_STEP_SUMMARY"

    - name: Upload Kani verification results
      uses: actions/upload-artifact@v5.0.0
      if: always()
      with:
        name: kani-verification-results-${{ github.run_number }}
        path: kani-results/
        retention-days: 10

    - name: Check verification status
      if: always()
      run: |
        if [[ "${{ env.failed-checks }}" != "0" ]]; then
          echo "::error::Kani bounded model checking detected verification failures"
          echo "::error::Failed checks: ${{ env.failed-checks }}/${{ env.total-checks }}"
          echo "Review the verification logs for specific mathematical or safety violations"
          exit 1
        fi

        if [[ "${{ env.successful-checks }}" == "0" ]]; then
          echo "::warning::No Kani verification checks were completed"
          echo "This may indicate a configuration or setup issue"
          exit 1
        fi

        echo "::notice::✅ Kani verification completed successfully"
        echo "::notice::Verified ${{ env.successful-checks }} mathematical and safety properties"

  kani-verification-summary:
    name: Kani Verification Summary
    runs-on: ubuntu-latest
    needs: [kani-arithmetic-verification]
    if: always()

    steps:
    - name: Generate comprehensive summary
      run: |
        {
          echo "# Kani Bounded Model Checking Summary"
          echo "**Verification Result:** ${{ needs.kani-arithmetic-verification.result }}"
          echo "**Date:** $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo ""
          echo "## Verification Overview"
          echo "**Kani Bounded Model Checking** provides formal mathematical proofs for critical algorithms:"
          echo ""
          echo "### 🔍 Analysis Scope"
          echo "- **MoveStats Arithmetic**: Statistical calculations and data operations"
          echo "- **Bounded Input Space**: Efficient verification with realistic value ranges"
          echo "- **Mathematical Correctness**: Formal proofs of arithmetic properties"
          echo "- **Safety Properties**: Overflow detection, division safety, memory bounds"
          echo ""
          echo "### 🛡️ Security Benefits"
          echo "**Mathematical Certainty:**"
          echo "- Division by zero cannot occur in statistical calculations"
          echo "- Arithmetic overflow is detected and handled safely"
          echo "- Data structure invariants are maintained under all operations"
          echo "- Memory access patterns are provably safe"
          echo ""
          echo "### 🔧 Integration with Security Pipeline"
          echo "**Kani complements our existing verification tools:**"
          echo "- **Rudra** (weekly): Static analysis including broader codebase"
          echo "- **Miri** (weekly + PR): Memory safety analysis on pure algorithms"
          echo "- **Kani** (weekly + PR): Mathematical correctness proofs (this workflow)"
          echo "- **Fuzz testing**: Stress testing with realistic attack vectors"
          echo ""
          echo "## Results"
          if [[ "${{ needs.kani-arithmetic-verification.result }}" == "success" ]]; then
            echo "✅ **Mathematical correctness verified** for critical arithmetic operations"
            echo "- All bounded model checking proofs completed successfully"
            echo "- Statistical calculations are provably correct within specified bounds"
            echo "- Arithmetic operations are safe from overflow and division errors"
            echo "- Data structure operations maintain mathematical invariants"
          else
            echo "❌ **Verification issues require attention**"
            echo "- Review Kani output for specific proof failures"
            echo "- Address any mathematical correctness violations before deployment"
            echo "- Consider adjusting bounds or strengthening preconditions"
          fi
          echo ""
          echo "## Development Guidance"
          echo "**For developers modifying verified code:**"
          echo "1. **Maintain bounds**: Keep input ranges within verified limits"
          echo "2. **Preserve invariants**: Don't break mathematical properties"
          echo "3. **Test locally**: Run \`cargo kani --harness <proof_name>\` before committing"
          echo "4. **Add proofs**: Consider adding Kani proofs for new arithmetic operations"
          echo ""
          echo "## Security Assurance"
          echo "This verification provides **mathematical certainty** that:"
          echo "- Critical calculations cannot produce undefined behavior"
          echo "- Arithmetic operations are safe within specified bounds"
          echo "- Statistical functions behave correctly under all valid inputs"
          echo "- Memory access patterns in verified functions are safe"
        } >> "$GITHUB_STEP_SUMMARY"

        # Final status
        if [[ "${{ needs.kani-arithmetic-verification.result }}" == "success" ]]; then
          echo "::notice::🔬 Kani bounded model checking completed successfully"
          echo "::notice::Mathematical correctness proven for critical arithmetic operations"
        else
          echo "::warning::🔍 Kani verification detected issues requiring investigation"
          echo "::warning::Review verification logs for specific mathematical violations"
        fi
