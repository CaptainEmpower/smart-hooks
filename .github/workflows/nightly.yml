name: Nightly Comprehensive Tests

on:
  schedule:
    # Run nightly tests at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_scope:
        description: 'Test scope to run'
        required: false
        default: 'all'
        type: choice
        options:
        - 'all'
        - 'unit'
        - 'integration'
      debug_mode:
        description: 'Enable debug logging'
        required: false
        default: 'false'
        type: choice
        options:
        - 'true'
        - 'false'

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  SMART_HOOKS_TEST_MODE: comprehensive
  RUST_LOG: info

permissions:
  contents: read
  checks: write
  issues: write

jobs:
  comprehensive-tests:
    name: Comprehensive Test Suite
    runs-on: ubuntu-latest
    if: github.event.inputs.test_scope == 'all' || github.event.inputs.test_scope == '' || github.event_name == 'schedule'

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Rust environment
      uses: ./.github/actions/setup-rust
      with:
        toolchain: stable
        cache-key: comprehensive
        install-system-deps: 'true'

    - name: Run all tests with coverage
      timeout-minutes: 15
      env:
        RUSTFLAGS: -D warnings
      run: |
        # Run comprehensive test suite
        echo "=== Unit Tests ==="
        cargo test --lib --release --verbose

        echo "=== Integration Tests ==="
        cargo test --test "*" --release --verbose

        echo "=== BDD Tests ==="
        if find tests -name "*bdd*" -o -name "*cucumber*" | grep -q .; then
          cargo test bdd --release --verbose || true
        fi

        echo "=== CLI Tests ==="
        cargo test --bin smart-hooks --release --verbose || true

  cross-platform-nightly:
    name: Cross-Platform Nightly (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Rust environment
      uses: ./.github/actions/setup-rust
      with:
        toolchain: stable
        cache-key: cross-platform-${{ matrix.os }}
        install-system-deps: 'true'

    - name: Run cross-platform tests
      timeout-minutes: 10
      run: |
        cargo test --lib --release

  feature-matrix:
    name: Feature Matrix Testing
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        features: 
          - ""
          - "claude-ai"
          - "hotreload"

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Rust environment
      uses: ./.github/actions/setup-rust
      with:
        toolchain: stable
        cache-key: features-${{ matrix.features }}
        install-system-deps: 'true'

    - name: Test with features
      timeout-minutes: 8
      run: |
        if [ -z "${{ matrix.features }}" ]; then
          echo "Testing default features"
          cargo test --lib --release
        else
          echo "Testing with features: ${{ matrix.features }}"
          cargo test --lib --features "${{ matrix.features }}" --release
        fi

  nightly-summary:
    name: Nightly Summary
    runs-on: ubuntu-latest
    needs: [comprehensive-tests, cross-platform-nightly, feature-matrix]
    if: always()

    steps:
    - name: Generate nightly summary
      run: |
        {
          echo "## Nightly Test Results"
          echo "**Date:** $(date -u +%Y-%m-%d\ %H:%M:%S\ UTC)"
          echo "**Workflow Run:** ${{ github.run_id }}"
          echo "**Commit:** ${{ github.sha }}"
          echo ""
          echo "### Test Results"
          echo "- **Comprehensive Tests:** ${{ needs.comprehensive-tests.result }}"
          echo "- **Cross-Platform:** ${{ needs.cross-platform-nightly.result }}"
          echo "- **Feature Matrix:** ${{ needs.feature-matrix.result }}"
        } >> "$GITHUB_STEP_SUMMARY"

        # Calculate overall health
        FAILED_JOBS=0
        for result in "${{ needs.comprehensive-tests.result }}" "${{ needs.cross-platform-nightly.result }}" "${{ needs.feature-matrix.result }}"; do
          if [ "$result" = "failure" ]; then
            FAILED_JOBS=$((FAILED_JOBS + 1))
          fi
        done

        echo "" >> "$GITHUB_STEP_SUMMARY"
        if [ "$FAILED_JOBS" -eq 0 ]; then
          echo "🎉 **All nightly tests passed!** The build is healthy." >> "$GITHUB_STEP_SUMMARY"
        else
          echo "❌ **$FAILED_JOBS nightly job(s) failed.** Please investigate." >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Create issue on failure
      if: failure() && github.event_name == 'schedule'
      uses: actions/github-script@v7
      with:
        script: |
          const title = `Nightly tests failed on ${new Date().toISOString().split('T')[0]}`;
          const body = `
          ## Nightly Test Failure Report
          
          **Workflow Run:** ${{ github.run_id }}
          **Commit:** ${{ github.sha }}
          **Failed Jobs:** Please check the workflow run for details.
          
          [View Workflow Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          `;
          
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: title,
            body: body,
            labels: ['bug', 'nightly-failure']
          });