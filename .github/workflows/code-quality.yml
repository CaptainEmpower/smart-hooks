name: Code Quality Analysis

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly code quality analysis on Sundays at 3 AM UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      skip_static_analysis:
        description: 'Skip static analysis'
        required: false
        default: 'false'
        type: choice
        options:
        - 'true'
        - 'false'
      skip_formal_verification:
        description: 'Skip formal verification (Prusti)'
        required: false
        default: 'false'
        type: choice
        options:
        - 'true'
        - 'false'

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  actions: read

jobs:
  prusti-formal-verification:
    name: Prusti Formal Verification
    runs-on: ubuntu-latest
    if: false  # Prusti disabled
    outputs:
      tool-status: ${{ env.prusti-tool-status }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Create Prusti verification directory
      run: |
        mkdir -p prusti-results
        echo "PRUSTI_RESULTS_DIR=$(pwd)/prusti-results" >> "$GITHUB_ENV"

    - name: Run Prusti verification on git-mvh crate
      id: prusti-verify
      uses: viperproject/prusti-action@master
      continue-on-error: true
      with:
        path: './crates/git-mvh'
        version: 'nightly'
        verify-crate: true
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Analyze Prusti verification results
      run: |
        # Since Prusti Action provides GitHub annotations, we'll capture the basic status
        # The action will have already provided detailed feedback via annotations

        if [[ "${{ steps.prusti-verify.outcome }}" == "success" ]]; then
          {
            echo "prusti-status=success"
            echo "prusti-tool-status=success"
            echo "verification-success=1"
            echo "verification-total=1"
          } >> "$GITHUB_ENV"
          echo "::notice::Prusti formal verification completed successfully"
        else
          {
            echo "prusti-status=failed"
            echo "prusti-tool-status=failed"
            echo "verification-success=0"
            echo "verification-total=1"
          } >> "$GITHUB_ENV"
          echo "::warning::Prusti verification encountered issues - check annotations for details"
        fi

        # Create basic log for consistency with other tools
        {
          echo "=== Prusti Formal Verification Results ==="
          echo "Verification completed using official Prusti GitHub Action"
          echo "Status: ${{ steps.prusti-verify.outcome }}"
          echo "Detailed results available in GitHub annotations"
          echo "Crate verified: crates/git-mvh"
        } > prusti-results/prusti.log

    - name: Analyze Prusti results
      if: always()
      run: |
        cd prusti-results

        # Count specific types of verification issues
        if grep -i "assertion might fail" prusti.log >/dev/null; then
          echo "assertion-failures=found" >> "$GITHUB_ENV"
          echo "::warning::Prusti found potential assertion failures"
        else
          echo "assertion-failures=none" >> "$GITHUB_ENV"
        fi

        if grep -i "overflow" prusti.log >/dev/null; then
          echo "overflow-issues=found" >> "$GITHUB_ENV"
          echo "::warning::Prusti detected potential overflow issues"
        else
          echo "overflow-issues=none" >> "$GITHUB_ENV"
        fi

        if grep -i "panic" prusti.log >/dev/null; then
          echo "panic-issues=found" >> "$GITHUB_ENV"
          echo "::warning::Prusti detected potential panic issues"
        else
          echo "panic-issues=none" >> "$GITHUB_ENV"
        fi

    - name: Generate Prusti verification report
      if: always()
      run: |
        cd prusti-results

        # Create comprehensive verification report
        {
          echo "# Prusti Formal Verification Report"
          echo "**Date:** $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "**Status:** ${{ env.prusti-status }}"
          echo "**Verified:** ${{ env.verification-success }}/${{ env.verification-total }} modules"
          echo ""
          echo "## Verification Issues"
          echo "- **Assertion Failures:** ${{ env.assertion-failures }}"
          echo "- **Overflow Issues:** ${{ env.overflow-issues }}"
          echo "- **Panic Issues:** ${{ env.panic-issues }}"
          echo ""
          echo "## Detailed Analysis"
          echo '```'
          tail -n 100 prusti.log 2>/dev/null || echo "No detailed output available"
          echo '```'
          echo ""
          echo "## Module Verification Status"
          echo '```'
          grep -E "(✓|✗|⚠)" prusti.log 2>/dev/null || echo "No module status available"
          echo '```'
        } > prusti-verification-report.md

        # Add to step summary
        cat prusti-verification-report.md >> "$GITHUB_STEP_SUMMARY"

    - name: Upload Prusti verification results
      uses: actions/upload-artifact@v5.0.0
      if: always()
      with:
        name: prusti-verification-${{ github.run_number }}
        path: prusti-results/
        retention-days: 10

    - name: Check verification status
      if: always()
      run: |
        if [[ "${{ env.prusti-status }}" == "failed" ]]; then
          echo "::error::Prusti formal verification failed - critical modules could not be verified"
          exit 1
        fi

        if [[ "${{ env.assertion-failures }}" == "found" ]] || [[ "${{ env.overflow-issues }}" == "found" ]] || [[ "${{ env.panic-issues }}" == "found" ]]; then
          echo "::warning::Prusti detected formal verification issues - review recommended"
          echo "Consider adding Prusti annotations (preconditions, postconditions) to improve verification"
        fi

        if [[ "${{ env.prusti-status }}" == "success" ]]; then
          echo "::notice::✅ All critical modules formally verified - absence of panics and overflows proven"
        fi

  code-quality-summary:
    name: Code Quality Summary
    runs-on: ubuntu-latest
    if: always()

    steps:
    - name: Generate code quality summary
      run: |
        {
          echo "# Code Quality Analysis Summary"
          echo "**Date:** $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "**Workflow Run:** ${{ github.run_number }}"
          echo ""
          echo "## Analysis Results"
          echo "- **Static Analysis (Rudra):** Removed. This workflow was inherited"
          echo "  from the sibling repository CaptainEmpower/git-mvh when smart-hooks"
          echo "  was extracted from it, and still pointed at \`crates/git-mvh\` — a path"
          echo "  that exists there, never here. Actions checks out only this repo, so"
          echo "  the job failed at setup on every run without analysing anything."
          echo "  git-mvh still runs Rudra against that crate, where the unsafe code"
          echo "  actually lives; smart-hooks contains none, so nothing is lost."
          echo "- **Formal Verification (Prusti):** Disabled"
          echo ""
          echo "Memory-safety coverage for this crate is therefore: nothing to cover."
          echo "Reintroduce a static-analysis job if and when \`unsafe\` is added."
        } >> "$GITHUB_STEP_SUMMARY"
