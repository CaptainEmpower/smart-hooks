name: PR Checks

on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: info

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.changes.outputs.rust }}
      workflows: ${{ steps.changes.outputs.workflows }}
      docs: ${{ steps.changes.outputs.docs }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Detect changes
      uses: dorny/paths-filter@v3.0.2
      id: changes
      with:
        filters: |
          rust:
            - '**/*.rs'
            - '**/Cargo.toml'
            - '**/Cargo.lock'
            - 'rust-toolchain.toml'
          workflows:
            - '.github/workflows/**'
            - '.github/actions/**'
          docs:
            - '**/*.md'
            - 'docs/**'

  rust-checks-skipped:
    name: Rust Checks (Skipped - No Rust Changes)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'false'
    steps:
    - name: Skip explanation
      run: |
        echo "ℹ️ Rust checks skipped - no Rust code changes detected"
        echo "The following checks were skipped because no .rs, Cargo.toml, or Rust-related files were modified:"
        echo "  • Lint and Format checks"
        echo "  • Unit Tests"
        echo "  • Integration Tests"
        echo ""
        echo "To force Rust checks to run, add 'force-rust-checks' to your commit message."

  lint-and-format:
    name: Lint and Format
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Rust environment
      uses: ./.github/actions/setup-rust
      with:
        toolchain: stable
        components: clippy,rustfmt
        cache-key: lint
        install-system-deps: 'true'

    - name: Check formatting
      run: |
        if ! cargo fmt --all -- --check; then
          echo "::error::Code formatting issues found. Please run 'cargo fmt' to fix."
          exit 1
        fi

    - name: Code quality linting with clippy
      run: |
        # Run clippy analysis (configuration in clippy.toml)
        cargo clippy --lib --all-features -- -D warnings

    - name: Check documentation
      run: |
        cargo doc --all-features --no-deps --document-private-items

  comprehensive-tests:
    name: Comprehensive Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Rust environment
      uses: ./.github/actions/setup-rust
      with:
        toolchain: stable
        cache-key: comprehensive-tests
        install-system-deps: 'true'

    - name: Run unit tests
      timeout-minutes: 8
      run: |
        # Unit tests with strict warning policy
        cargo test --lib --release --quiet

    - name: Run integration tests
      timeout-minutes: 8
      env:
        # Allow common test-related warnings while keeping other warnings strict
        RUSTFLAGS: -D warnings -A dead_code -A unused_imports -A unused_variables
      run: |
        # Run integration tests
        echo "Running integration tests..."
        cargo test --test "*" --release --quiet

  cross-platform-smoke:
    name: Cross-Platform Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [changes, comprehensive-tests]
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Rust environment
      uses: ./.github/actions/setup-rust
      with:
        toolchain: stable
        cache-key: smoke-${{ matrix.os }}
        install-system-deps: 'true'

    - name: Run smoke tests
      timeout-minutes: 5
      run: |
        # Basic compilation and core functionality test
        cargo test --lib -- --test-threads=1 --quiet

  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [changes, lint-and-format, comprehensive-tests, cross-platform-smoke]
    if: always()

    steps:
    - name: Generate PR summary
      env:
        HEAD_REF: ${{ github.head_ref }}
      run: |
        {
          echo "## PR Check Results"
          echo ""
          echo "**Workflow Run:** ${{ github.run_id }}"
          echo "**Commit:** ${{ github.sha }}"
          echo "**Branch:** $HEAD_REF"
          echo ""
          echo "### Changes Detected"
          echo "- **Rust code:** ${{ needs.changes.outputs.rust }}"
          echo "- **Workflows:** ${{ needs.changes.outputs.workflows }}"
          echo "- **Documentation:** ${{ needs.changes.outputs.docs }}"
          echo ""
          echo "### Check Results"
          echo "- **Lint & Format:** ${{ needs.lint-and-format.result }}"
          echo "- **Comprehensive Tests:** ${{ needs.comprehensive-tests.result }}"
          echo "- **Cross-Platform:** ${{ needs.cross-platform-smoke.result }}"
        } >> "$GITHUB_STEP_SUMMARY"

        # Overall status
        if [[ "${{ needs.lint-and-format.result }}" == "success" &&
              "${{ needs.comprehensive-tests.result }}" == "success" &&
              "${{ needs.cross-platform-smoke.result }}" == "success" ]]; then
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ **All PR checks passed!** Ready for review." >> "$GITHUB_STEP_SUMMARY"
        else
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "❌ **Some PR checks failed.** Please review and fix issues." >> "$GITHUB_STEP_SUMMARY"
        fi
