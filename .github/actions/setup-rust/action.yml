name: 'Setup Rust Environment'
description: 'Install Rust toolchain with caching and system dependencies'
inputs:
  toolchain:
    description: 'Rust toolchain to install'
    required: false
    default: 'stable'
  components:
    description: 'Additional Rust components to install'
    required: false
    default: 'clippy,rustfmt'
  cache-key:
    description: 'Additional cache key suffix'
    required: false
    default: 'default'
  install-cargo-audit:
    description: 'Install cargo-audit tool'
    required: false
    default: 'false'
  install-system-deps:
    description: 'Install system dependencies'
    required: false
    default: 'true'

outputs:
  cache-hit:
    description: 'Whether cache was hit'
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: 'composite'
  steps:
    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1.15.2
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}

    - name: Install system dependencies (Ubuntu)
      if: runner.os == 'Linux' && inputs.install-system-deps == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y git libgit2-dev pkg-config libssl-dev

    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS' && inputs.install-system-deps == 'true'
      shell: bash
      run: |
        brew install git libgit2 pkg-config openssl

    - name: Setup Windows build environment
      if: runner.os == 'Windows' && inputs.install-system-deps == 'true'
      shell: powershell
      run: |
        $ErrorActionPreference = 'Stop'

        try {
          $cargoDir = "$env:USERPROFILE\.cargo"
          if (!(Test-Path $cargoDir)) {
            New-Item -ItemType Directory -Path $cargoDir -Force | Out-Null
          }

          $configFile = "$cargoDir\config.toml"
          '[target.x86_64-pc-windows-msvc]' | Out-File -FilePath $configFile -Encoding utf8
          'rustflags = ["-l", "advapi32", "-l", "crypt32", "-l", "winhttp"]' | Out-File -FilePath $configFile -Encoding utf8 -Append

          Write-Host "Windows build environment configured successfully"
        } catch {
          Write-Error "Failed to setup Windows build environment: $_"
          exit 1
        }

    - name: Cache Rust dependencies
      id: cache
      uses: Swatinem/rust-cache@v2.8.1
      with:
        shared-key: base-deps
        key: ${{ runner.os }}-${{ inputs.cache-key }}
        cache-directories: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        cache-on-failure: true

    - name: Install cargo-audit
      if: inputs.install-cargo-audit == 'true'
      shell: bash
      run: cargo install cargo-audit --quiet
