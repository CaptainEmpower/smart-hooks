[package]
name = "smart-hooks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Main unified binary
[[bin]]
name = "smart-hooks"
path = "src/main.rs"

# Legacy binaries (kept for compatibility during transition)
[[bin]]
name = "selective-unit-tests"
path = "src/selective_unit_tests.rs"

[[bin]]
name = "integration-tests-if-needed"
path = "src/integration_tests_if_needed.rs"

[[bin]]
name = "smart-test-selector"
path = "src/smart_test_selector_refactored.rs"

[[bin]]
name = "claude-bdd-selector"
path = "src/claude_bdd_selector.rs"

[[bin]]
name = "conditional-compilation-checker"
path = "src/conditional_compilation_checker.rs"

# Multi-language project analyzer
[[bin]]
name = "multi-lang-analyzer"
path = "src/bin/multi-lang-analyzer.rs"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
serde_json = "1.0"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }

# Hot reload dependencies
blake3 = "1.5"           # Fast content hashing
notify = "8.2"           # File system watching
tokio = { version = "1.0", features = ["full"] }
bincode = "1.3"          # Efficient cache serialization
async-trait = "0.1"      # Async traits for cache storage
tracing = "0.1"          # Structured logging
thiserror = "2.0"        # Error handling macros

# Optional Claude AI integration - using CLI directly due to SDK issues
tempfile = { version = "3.0", optional = true }

[dev-dependencies]
tempfile = "3.0"
tokio = { version = "1.0", features = ["full"] }
cucumber = "0.21"
regex = "1.0"

[features]
default = ["hotreload"]
claude-ai = ["tempfile"]
hotreload = []  # Hot reload feature flag