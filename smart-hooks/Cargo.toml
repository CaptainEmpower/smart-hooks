[package]
name = "smart-hooks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Main unified binary
[[bin]]
name = "smart-hooks"
path = "src/main.rs"

# Legacy binaries (kept for compatibility during transition)
[[bin]]
name = "selective-unit-tests"
path = "src/selective_unit_tests.rs"

[[bin]]
name = "integration-tests-if-needed"
path = "src/integration_tests_if_needed.rs"

[[bin]]
name = "smart-test-selector"
path = "src/smart_test_selector_refactored.rs"

[[bin]]
name = "claude-bdd-selector"
path = "src/claude_bdd_selector.rs"

[[bin]]
name = "conditional-compilation-checker"
path = "src/conditional_compilation_checker.rs"

# Multi-language project analyzer
[[bin]]
name = "multi-lang-analyzer"
path = "src/bin/multi-lang-analyzer.rs"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
serde_json = "1.0"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }

# Optional Claude AI integration - using CLI directly due to SDK issues
tokio = { version = "1.0", optional = true, features = ["full"] }
tempfile = { version = "3.0", optional = true }

[dev-dependencies]
tempfile = "3.0"
tokio = { version = "1.0", features = ["full"] }

[features]
default = []
claude-ai = ["tokio", "tempfile"]