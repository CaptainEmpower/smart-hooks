[package]
name = "smart-hooks"
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/CaptainEmpower/smart-hooks"
description = "Selects and runs the Rust tests affected by a set of changed files"
authors = ["Smart Hooks Team"]
keywords = ["git", "hooks", "testing", "cargo", "pre-commit"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "smart-hooks"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
regex = "1.0"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = { workspace = true }
regex = "1.0"

[lib]
name = "smart_hooks"
path = "src/lib.rs"
