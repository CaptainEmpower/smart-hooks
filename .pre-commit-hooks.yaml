# Hooks published by this repository.
#
# One hook, because the binary implements one thing. The previous manifest
# advertised nine; four named subcommands that did not exist, one named a binary
# that was never built, and one passed a literal `selective` that was silently
# read as a filename. See docs/adr/0002-narrow-scope-to-rust-test-impact-selection.md
# and issue #6.
#
# Run it under prek (recommended) or pre-commit:
#
#   repos:
#     - repo: https://github.com/CaptainEmpower/smart-hooks
#       rev: v0.3.0
#       hooks:
#         - id: smart-test-selector

- id: smart-test-selector
  name: Smart Test Selector
  description: Runs the Rust tests affected by the staged files, selected from their module paths
  entry: smart-hooks test
  language: rust
  types: [rust]
  pass_filenames: true
  require_serial: true
  minimum_pre_commit_version: 3.2.0
