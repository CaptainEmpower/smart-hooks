[package]
name = "smart-hooks"
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/CaptainEmpower/smart-hooks"
description = "Intelligent git hooks that understand your code changes and automatically select the right tests to run"
authors = ["Smart Hooks Team"]
keywords = ["git", "hooks", "testing", "bdd", "automation"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "selective-unit-tests"
path = "src/selective_unit_tests.rs"

[[bin]]
name = "integration-tests-if-needed"
path = "src/integration_tests_if_needed.rs"

[[bin]]
name = "smart-test-selector"
path = "src/smart_test_selector_refactored.rs"

[[bin]]
name = "claude-bdd-selector"
path = "src/claude_bdd_selector.rs"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
serde_json = "1.0"

# Optional Claude AI integration - using CLI directly due to SDK issues
tokio = { version = "1.0", optional = true, features = ["full"] }
tempfile = { version = "3.0", optional = true }

[dev-dependencies]
tempfile = "3.0"
tokio = { version = "1.0", features = ["full"] }
regex = "1.0"

[features]
default = []
claude-ai = ["tokio", "tempfile"]
hotreload = []